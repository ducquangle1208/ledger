name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (normally a commit SHA)
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: mini-ledger-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mini-ledger-backend:${{ inputs.image_tag }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mini-ledger-frontend:${{ inputs.image_tag }}

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    steps:
      - name: Deploy immutable images over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.VPS_APP_DIR }}"
            export BACKEND_IMAGE="ghcr.io/${{ github.repository_owner }}/mini-ledger-backend:${{ inputs.image_tag }}"
            export FRONTEND_IMAGE="ghcr.io/${{ github.repository_owner }}/mini-ledger-frontend:${{ inputs.image_tag }}"
            ./scripts/deploy.sh
            curl --fail --silent --show-error "https://${{ secrets.APP_DOMAIN }}/actuator/health/readiness"
