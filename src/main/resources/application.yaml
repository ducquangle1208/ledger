spring:
  application:
    name: mini_ledger

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  data:
    redis:
      repositories:
        enabled: false

server:
  error:
    include-message: never
