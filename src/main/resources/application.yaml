spring:
  application:
    name: mini_ledger

  datasource:
    url: jdbc:postgresql://localhost:5433/mini_ledger
    username: ledger
    password: ledger
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  data:
    redis:
      repositories:
        enabled: false

server:
  error:
    include-message: never
